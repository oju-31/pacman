version: '3.8'

services:
  pacman-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pacman-game
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pacman.rule=Host(`pacman.localhost`)"
      - "traefik.http.services.pacman.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
